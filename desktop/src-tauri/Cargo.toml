[package]
name = "chat-launcher-desktop"
version = "1.3.0"
description = "Chat Launcher — desktop shell around the live PWA"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
