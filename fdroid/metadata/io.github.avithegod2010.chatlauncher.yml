AutoName: Chat Launcher

Summary: Open any phone number's chat in WhatsApp, Telegram, Signal and more

Description: |-
  Type a phone number, tap an app, start chatting. Chat Launcher opens a
  number's chat directly in WhatsApp, Telegram, Signal, SMS, Viber, Skype,
  LINE or Threema — no contacts app, no copy-pasting.

  Features:
  * Country picker with ~230 dial codes and per-country length validation
  * Smart paste, preset messages, launch history with notes and pins
  * QR share, bulk launch, English/Hindi/more UI languages
  * No tracking, no accounts — everything stays on your device
  * Installable PWA with offline support

  The Android app is a thin shell around the live web app; it loads the
  canonical Chat Launcher PWA and hands deep links to the installed
  messengers.

