name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dev tooling
        run: npm ci

      - name: Unit + property-based tests
        run: npm test

      - name: Bundle budget
        run: node tools/bundle-budget.mjs

      - name: F-Droid metadata lint
        run: node tools/fdroid-lint.mjs

      - name: Start dev server
        run: |
          node tools/serve.mjs &
          sleep 2

      - name: Adversarial bug-hunt (headless Chromium)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/bug-hunt.mjs

      - name: E2E journeys (headless Chromium)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/e2e.mjs

      - name: Ensure site assets resolve
        run: |
          for p in "" css/app.css js/main.js js/i18n.js js/stats.js js/qr.js \
                   js/backup.js js/colors.js js/vcf.js js/queue.js \
                   js/vendor/qrcode-generator.js manifest.webmanifest sw.js icons/icon-192.png; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8143/$p")
            [ "$code" = "200" ] || { echo "MISSING /$p ($code)"; exit 1; }
          done

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Start dev server
        run: |
          node tools/serve.mjs &
          sleep 2

      - name: Lighthouse budget
        run: |
          # Three passes, budget against the best one: shared-runner cold runs
          # are noisy (single passes have ranged 72–94 for the same page).
          for i in 1 2 3; do
            npx --yes lighthouse@12 http://127.0.0.1:8143/ \
              --quiet --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path=./lighthouse-$i.json
          done
          node -e "
            const runs = [1, 2, 3].map((i) => require('./lighthouse-' + i + '.json'));
            const per = runs.map((r) => Object.fromEntries(Object.entries(r.categories).map(([k, v]) => [k, Math.round(v.score * 100)])));
            const best = Object.fromEntries(Object.keys(per[0]).map((k) => [k, Math.max(...per.map((p) => p[k] ?? 0))]));
            console.log('passes:', JSON.stringify(per));
            console.log('best:', JSON.stringify(best));
            // Performance 80 accounts for cold-run noise on shared runners
            // (no CDN cache, no HTTP compression from the dev server).
            const budget = { performance: 80, accessibility: 95, 'best-practices': 95, seo: 90 };
            let failed = false;
            for (const [k, min] of Object.entries(budget)) {
              if ((best[k] ?? 0) < min) { console.error('BELOW BUDGET', k, best[k], '<', min); failed = true; }
            }
            process.exit(failed ? 1 : 0);
          "
