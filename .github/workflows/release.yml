name: Release (APK via EAS)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Append this tag's notes to CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          # A missing release is normal on a tag push (GitHub creates releases
          # later), so do not capture the API error body as release notes.
          if ! body=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq .body 2>/dev/null); then
            body=""
          fi
          if [ -z "$body" ]; then
            body=$(git tag -l --format='%(contents)' "$TAG")
          fi
          [ -z "$body" ] && body="_No release notes provided._"
          if grep -qF "## [$TAG]" CHANGELOG.md 2>/dev/null; then
            echo "already recorded"; exit 0
          fi
          # Keep everything before the first "## [" entry, insert the new entry,
          # then keep the old entries. (Splitting on a fixed line number used to
          # leave the previous version's heading above the new one.)
          {
            awk '/^## \[/{exit} {print}' CHANGELOG.md 2>/dev/null ||
              printf '# Changelog\n\nAll notable changes to Chat Launcher. Newest first.\n\n'
          } > /tmp/cl.md
          {
            printf '## [%s] — %s\n\n%s\n\n' "$TAG" "$(date -u +%Y-%m-%d)" "$body"
            awk 'seen{print} /^## \[/{seen=1; print}' CHANGELOG.md 2>/dev/null || true
          } >> /tmp/cl.md
          mv /tmp/cl.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): $TAG"
          git push origin HEAD:main

  android-apk:
    runs-on: ubuntu-latest
    # Job-level env so the step `if` can test the secret without the
    # (unsupported) `secrets` context inside `if`.
    env:
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Expo dependencies (config plugins need them client-side)
        run: |
          cd expo-app
          npm ci --no-fund --no-audit

      - name: Build APK on EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm install -g eas-cli
          cd expo-app
          eas build --platform android --profile preview --non-interactive --no-wait --json > build.json
          BUILD_ID=$(node -e "const j=require('./build.json');console.log(Array.isArray(j)?j[0].id:j.id)")
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Wait for the build and download the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd expo-app
          for i in $(seq 1 60); do
            STATUS=$(eas build:view "$BUILD_ID" --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).status))")
            echo "poll $i: $STATUS"
            case "$STATUS" in
              FINISHED) break ;;
              ERRORED|CANCELED) echo "EAS build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          eas build:view "$BUILD_ID" --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).artifacts.buildUrl))" > apk-url.txt
          curl -sL -o app-release.apk "$(cat apk-url.txt)"
          ls -la app-release.apk
          sha256sum app-release.apk | tee SHA256SUMS.txt

      - name: Attach APK + checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release upload "$TAG" expo-app/app-release.apk expo-app/SHA256SUMS.txt --clobber

      - name: Submit AAB to Play (only when the service account secret exists)
        if: ${{ env.GOOGLE_SERVICE_ACCOUNT != '' }}
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd expo-app
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT" | base64 -d > google-service-account.json
          eas build --platform android --profile production --non-interactive --no-wait --json > aab.json
          AAB_ID=$(node -e "const j=require('./aab.json');console.log(Array.isArray(j)?j[0].id:j.id)")
          for i in $(seq 1 60); do
            STATUS=$(eas build:view "$AAB_ID" --json | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).status))")
            echo "aab poll $i: $STATUS"
            case "$STATUS" in
              FINISHED) break ;;
              ERRORED|CANCELED) echo "AAB build $STATUS"; exit 1 ;;
            esac
            sleep 30
          done
          eas submit --platform android --profile production --non-interactive --id "$AAB_ID" || \
            echo "::warning::eas submit failed — check Play Console setup and the service account"
