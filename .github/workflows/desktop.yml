name: Desktop (Windows)

# Builds desktop/src-tauri on a GitHub runner so the desktop shell never has to
# be compiled on the laptop (no Rust/MSVC locally, and C: has no room for them).
# Runs on demand, and on any desktop/** push so breakage is caught immediately.
#
# The build also produces the signed updater package and the `latest.json`
# feed the app checks on startup (tag `desktop-latest`).

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Rust toolchain (MSVC, preinstalled on the runner)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: desktop-tauri

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # frontendDist is desktop/src (a committed static page), so there is no
      # web build step: tauri copies it and links the Rust binary.
      # The signing key makes `createUpdaterArtifacts` emit the .nsis.zip and
      # its .sig — without it the build fails on purpose.
      - name: Build the desktop shell
        working-directory: desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: tauri build --bundles nsis

      - name: Collect the exe, installer and updater package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp desktop/src-tauri/target/release/chat-launcher-desktop.exe out/
          cp desktop/src-tauri/target/release/bundle/nsis/*-setup.exe out/
          cp desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip out/
          cp desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig out/
          cd out
          sha256sum ./*.exe ./*.nsis.zip > SHA256SUMS.txt
          ls -la
          cat SHA256SUMS.txt

      # The updater reads this feed: one platform entry pointing at the
      # desktop-latest copy of the signed zip.
      - name: Generate latest.json
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          ZIP=$(basename "$(ls out/*.nsis.zip)")
          ENCODED=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$ZIP")
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest/${ENCODED}"
          node -e '
            const fs = require("fs");
            const [version, sigPath, url, out] = process.argv.slice(1);
            fs.writeFileSync(out, JSON.stringify({
              version,
              notes: `Chat Launcher desktop ${version}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(sigPath, "utf8").trim(),
                  url,
                },
              },
            }, null, 2));
          ' "$VERSION" "out/${ZIP}.sig" "$URL" out/latest.json
          cat out/latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chat-launcher-desktop-${{ github.run_number }}
          path: out/
          if-no-files-found: error
          retention-days: 30

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'out/*.exe'

      - name: Attach to the release (tags desktop-v* only)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --notes "Desktop shell $TAG"
          gh release upload "$TAG" out/*.exe out/*.nsis.zip out/*.nsis.zip.sig out/SHA256SUMS.txt --clobber

      # Rolling feed the app polls. Published from main and version tags only —
      # never from a feature branch, which would ship an untested build to users.
      - name: Publish the update feed (desktop-latest)
        if: startsWith(github.ref, 'refs/tags/desktop-v') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=desktop-latest
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Chat Launcher Desktop — latest" \
              --notes "Rolling feed used by the desktop app's built-in updater. Versioned installers are attached to each desktop-v* release."
          gh release upload "$TAG" out/*.nsis.zip out/*.nsis.zip.sig out/latest.json --clobber
