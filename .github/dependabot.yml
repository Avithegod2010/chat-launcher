version: 2
updates:
  # Web app + tooling (zero runtime deps; dev tooling only)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dev-tools:
        dependency-type: development
    open-pull-requests-limit: 5

  # Android shell (Expo SDK pins most versions; grouped to avoid conflicts)
  - package-ecosystem: npm
    directory: "/expo-app"
    schedule:
      interval: weekly
    groups:
      expo-shell:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
